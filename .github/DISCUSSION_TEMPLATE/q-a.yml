title: "[Help] "
body:
  - type: dropdown
    id: phase
    attributes:
      label: Where are you stuck?
      options:
        - Setup and build
        - Writing builder code
        - Local run
        - Submission and judge
        - Reading the ledger or site feed
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, commit of this repository.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and expected result
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
    validations:
      required: true
